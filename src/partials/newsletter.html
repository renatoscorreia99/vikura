<section class="pause" id="newsletter" aria-labelledby="pausa-titulo">
  <div class="wrap g12 pause__grid rule-top">
    <h2 class="display-m pause__title" id="pausa-titulo">Uma pausa para entender melhor.</h2>
    <p class="pause__text body-l">Receba uma seleção de conteúdos, estudos e perspectivas sobre saúde e bem-estar.</p>
    <form class="signup" novalidate>
      <label for="email">Seu e-mail</label>
      <div class="signup__field">
        <input id="email" type="email" name="email" placeholder="nome@email.com" autocomplete="email" required>
        <button class="cta" type="submit"><span class="cta__text">Assinar</span><span class="cta__mark" aria-hidden="true"><span class="cp"></span></span></button>
      </div>
      <p class="signup__note">Às quintas-feiras, uma vez por semana. Você pode cancelar quando quiser.</p>
    </form>
  </div>
</section>
