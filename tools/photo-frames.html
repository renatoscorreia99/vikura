<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vikura — gerador de quadros de direção fotográfica</title>
<style>body{margin:0;background:#111}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Light studies used as art-direction stand-ins until the commissioned photography arrives.
// Each frame carries the colour, light direction and negative space of its brief,
// never a fake person. Rendered to JPG by tools/build-photos.mjs.

const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

function grain(ctx, w, h, amount = 18) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rand() - 0.5) * amount;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

function vignette(ctx, w, h, o = 0.28) {
  const g = ctx.createRadialGradient(w * 0.5, h * 0.48, Math.min(w, h) * 0.35, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
  g.addColorStop(0, 'rgba(20,8,6,0)');
  g.addColorStop(1, `rgba(20,8,6,${o})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}

function bloom(ctx, x, y, r, color, o = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', o));
  g.addColorStop(0.35, color.replace('A', o * 0.45));
  g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
}

function vgrad(ctx, w, h, stops, y0 = 0, y1 = h) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.fillRect(0, y0, w, y1 - y0);
}

function blurred(ctx, px, fn) { ctx.save(); ctx.filter = `blur(${px}px)`; fn(); ctx.restore(); }

const scenes = {
  // Deep blue sky, late sun from the right, a band of dry golden grass. Wind.
  hero(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#183A73'], [0.45, '#2F5E9E'], [0.72, '#7FA2C6'], [0.8, '#C9C2AE']]);
    bloom(ctx, w * 0.93, h * 0.36, w * 0.5, 'rgba(255,214,150,A)', 0.95);
    blurred(ctx, w * 0.004, () => {
      vgrad(ctx, w, h, [[0, '#D9A75E'], [0.4, '#B97E36'], [1, '#6E4519']], h * 0.74, h);
      for (let i = 0; i < 900; i++) {
        const x = rand() * w, y = h * 0.74 + rand() * h * 0.26, l = 20 + rand() * 90;
        ctx.strokeStyle = `rgba(${rand() > .5 ? '255,226,160' : '90,54,18'},${0.15 + rand() * 0.25})`;
        ctx.lineWidth = 1 + rand() * 3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 20 + rand() * 30, y - l * 0.6, x + 40 + rand() * 40, y - l); ctx.stroke();
      }
    });
    bloom(ctx, w * 0.96, h * 0.7, w * 0.35, 'rgba(255,190,110,A)', 0.55);
    vignette(ctx, w, h, 0.22); grain(ctx, w, h, 22);
  },

  // Morning light through a window, falling across linen. Quiet, warm, unhurried.
  sono(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#C9A57E'], [1, '#8E6A4C']]);
    blurred(ctx, w * 0.02, () => {
      ctx.fillStyle = 'rgba(255,232,190,0.85)';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        const x = w * (0.18 + i * 0.17);
        ctx.moveTo(x, -h * 0.1); ctx.lineTo(x + w * 0.11, -h * 0.1);
        ctx.lineTo(x + w * 0.33, h * 1.1); ctx.lineTo(x + w * 0.2, h * 1.1); ctx.fill();
      }
    });
    blurred(ctx, w * 0.03, () => {
      ctx.fillStyle = 'rgba(250,236,209,0.55)';
      ctx.beginPath(); ctx.ellipse(w * 0.5, h * 0.92, w * 0.7, h * 0.32, -0.05, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(110,80,58,0.35)';
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(w * (0.1 + i * 0.18), h * (0.78 + rand() * 0.1), w * 0.12, h * 0.03, 0.2, 0, Math.PI * 2); ctx.fill(); }
    });
    bloom(ctx, w * 0.2, h * 0.1, w * 0.6, 'rgba(255,224,170,A)', 0.5);
    vignette(ctx, w, h, 0.3); grain(ctx, w, h, 20);
  },

  // Overhead, on a terracotta table: bowls, citrus, hands about to reach in.
  nutricao(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#B5583A'], [1, '#7E3524']]);
    blurred(ctx, w * 0.03, () => {
      const forms = [[0.3, 0.42, 0.2, '#F1DFC0'], [0.68, 0.56, 0.16, '#E9C88E'], [0.52, 0.2, 0.08, '#E5813F'], [0.84, 0.22, 0.07, '#F0A13D'], [0.15, 0.82, 0.1, '#EAD4AE']];
      forms.forEach(([x, y, r, c]) => {
        ctx.fillStyle = 'rgba(50,14,8,0.35)';
        ctx.beginPath(); ctx.ellipse(w * x + w * 0.02, h * y + w * 0.025, w * r, w * r * 0.95, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(w * x, h * y, w * r, w * r * 0.95, 0, 0, Math.PI * 2); ctx.fill();
      });
    });
    bloom(ctx, w * 0.1, h * 0.05, w * 0.7, 'rgba(255,220,170,A)', 0.4);
    vignette(ctx, w, h, 0.3); grain(ctx, w, h, 20);
  },

  // Close portrait in side light. Dark room, one window, real skin.
  retrato(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#2E211C'], [1, '#1A1310']]);
    bloom(ctx, w * -0.05, h * 0.38, w * 1.05, 'rgba(255,190,130,A)', 0.62);
    blurred(ctx, w * 0.08, () => {
      ctx.fillStyle = 'rgba(255,214,170,0.22)';
      ctx.fillRect(w * 0.0, h * 0.12, w * 0.22, h * 0.6);
    });
    vignette(ctx, w, h, 0.42); grain(ctx, w, h, 24);
  },

  // Cycling along the coast road: motion, wind, hard afternoon light, saturated sky.
  ativo(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#1C4A8C'], [0.55, '#4D80BC'], [0.62, '#B9C8CF']], 0, h * 0.62);
    vgrad(ctx, w, h, [[0, '#2C6F86'], [1, '#1D4E63']], h * 0.6, h * 0.72);
    vgrad(ctx, w, h, [[0, '#C7A27A'], [1, '#8F6845']], h * 0.72, h);
    blurred(ctx, 6, () => {
      for (let i = 0; i < 160; i++) {
        const y = h * (0.73 + rand() * 0.27), x = rand() * w;
        ctx.strokeStyle = `rgba(255,240,215,${0.08 + rand() * 0.18})`; ctx.lineWidth = 2 + rand() * 4;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 120 + rand() * 260, y); ctx.stroke();
      }
    });
    bloom(ctx, w * 0.12, h * 0.15, w * 0.45, 'rgba(255,226,180,A)', 0.55);
    vignette(ctx, w, h, 0.2); grain(ctx, w, h, 20);
  },

  // Open sea at first light. Silver hair, water to the shoulders.
  longevidade(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#28497A'], [0.5, '#7C9AC0'], [0.9, '#F2C9A0']], 0, h * 0.46);
    bloom(ctx, w * 0.7, h * 0.44, w * 0.55, 'rgba(255,214,160,A)', 0.9);
    vgrad(ctx, w, h, [[0, '#4F7896'], [0.5, '#24506E'], [1, '#14334A']], h * 0.46, h);
    blurred(ctx, 3, () => {
      for (let i = 0; i < 700; i++) {
        const y = h * (0.47 + Math.pow(rand(), 1.6) * 0.53), x = rand() * w;
        const near = (y - h * 0.46) / (h * 0.54);
        const warm = Math.max(0, 1 - Math.abs(x / w - 0.7) * 2.2) * (1 - near);
        ctx.strokeStyle = `rgba(255,${210 + warm * 30},${170 + warm * 40},${0.08 + warm * 0.5 + rand() * 0.1})`;
        ctx.lineWidth = 1 + near * 5;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10 + near * 120 * rand(), y); ctx.stroke();
      }
    });
    vignette(ctx, w, h, 0.25); grain(ctx, w, h, 20);
  },

  // Leaf shadows on a limewashed wall; a stem in a glass. Botanical, never recreational.
  botanica(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#EADBC0'], [1, '#CDB894']]);
    bloom(ctx, w * 0.85, h * 0.1, w * 0.8, 'rgba(255,240,205,A)', 0.8);
    blurred(ctx, w * 0.014, () => {
      for (let i = 0; i < 26; i++) {
        const cx = w * (0.15 + rand() * 0.6), cy = h * (0.08 + rand() * 0.6);
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.9 + rand() * 1.4);
        ctx.fillStyle = `rgba(78,74,46,${0.18 + rand() * 0.16})`;
        ctx.beginPath(); ctx.ellipse(0, 0, w * (0.05 + rand() * 0.05), w * (0.012 + rand() * 0.01), 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(78,74,46,0.22)'; ctx.lineWidth = w * 0.006;
      ctx.beginPath(); ctx.moveTo(w * 0.42, h * 1.0); ctx.bezierCurveTo(w * 0.44, h * 0.6, w * 0.4, h * 0.4, w * 0.5, h * 0.08); ctx.stroke();
    });
    blurred(ctx, w * 0.004, () => {
      ctx.fillStyle = 'rgba(255,250,236,0.35)';
      ctx.fillRect(w * 0.6, h * 0.62, w * 0.16, h * 0.32);
      ctx.fillStyle = 'rgba(96,108,62,0.75)';
      ctx.fillRect(w * 0.676, h * 0.3, w * 0.008, h * 0.6);
      ctx.save(); ctx.translate(w * 0.68, h * 0.32); ctx.rotate(-0.6);
      ctx.beginPath(); ctx.ellipse(w * 0.05, 0, w * 0.06, w * 0.016, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(w * 0.68, h * 0.42); ctx.rotate(0.5);
      ctx.beginPath(); ctx.ellipse(-w * 0.045, 0, w * 0.055, w * 0.014, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    });
    vignette(ctx, w, h, 0.18); grain(ctx, w, h, 16);
  },

  // Reading at the kitchen table, late afternoon. Knowledge as a daily habit.
  leitura(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#5A4636'], [1, '#2E241E']]);
    bloom(ctx, w * 0.85, h * 0.2, w * 0.75, 'rgba(255,200,140,A)', 0.75);
    blurred(ctx, w * 0.015, () => {
      ctx.fillStyle = 'rgba(244,228,200,0.9)';
      ctx.save(); ctx.translate(w * 0.5, h * 0.78); ctx.rotate(-0.08); ctx.fillRect(-w * 0.28, -h * 0.1, w * 0.56, h * 0.22); ctx.restore();
      ctx.fillStyle = 'rgba(160,98,64,0.8)';
      ctx.beginPath(); ctx.ellipse(w * 0.2, h * 0.7, w * 0.06, w * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    });
    vignette(ctx, w, h, 0.35); grain(ctx, w, h, 22);
  },

  // Eyes closed by an open window, early morning. A quiet human moment.
  janela(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#D3B08C'], [1, '#97714F']]);
    blurred(ctx, w * 0.035, () => {
      ctx.fillStyle = 'rgba(255,244,222,0.92)';
      ctx.fillRect(w * 0.05, h * 0.06, w * 0.22, h * 0.74);
      ctx.fillStyle = 'rgba(255,236,206,0.45)';
      ctx.beginPath(); ctx.moveTo(w * 0.27, h * 0.8); ctx.lineTo(w * 0.05, h * 0.8); ctx.lineTo(w * 0.3, h * 1.1); ctx.lineTo(w * 0.75, h * 1.1); ctx.fill();
    });
    bloom(ctx, w * 0.16, h * 0.4, w * 0.75, 'rgba(255,236,200,A)', 0.55);
    vignette(ctx, w, h, 0.32); grain(ctx, w, h, 20);
  },

  // A walk at dusk with a friend: shoulders, laughter, out of focus city lights.
  caminhada(ctx, w, h) {
    vgrad(ctx, w, h, [[0, '#33415E'], [0.6, '#8C6E73'], [1, '#D59A6E']]);
    blurred(ctx, w * 0.01, () => {
      for (let i = 0; i < 40; i++) {
        ctx.fillStyle = `rgba(255,${190 + rand() * 50},${120 + rand() * 60},${0.2 + rand() * 0.35})`;
        const r = w * (0.008 + rand() * 0.02);
        ctx.beginPath(); ctx.arc(rand() * w, h * (0.35 + rand() * 0.35), r, 0, Math.PI * 2); ctx.fill();
      }
    });
    vignette(ctx, w, h, 0.3); grain(ctx, w, h, 22);
  },
};

window.renderScene = (name, w, h) => {
  const c = document.getElementById('c');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  scenes[name](ctx, w, h);
  return true;
};
</script>
</body>
</html>
