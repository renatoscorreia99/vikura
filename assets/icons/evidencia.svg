    <feComposite in="grainDark" in2="SourceAlpha" operator="in" result="gd"/>
    <feComposite in="grainLight" in2="SourceAlpha" operator="in" result="gl"/>
    <feMerge>
      <feMergeNode in="SourceGraphic"/>
      <feMergeNode in="inner"/>
