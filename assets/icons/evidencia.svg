      <feMergeNode in="gl"/>
    </feMerge>
  </filter>
  <filter id="vk-cast" x="-30%" y="-100%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="5"/>
  </filter></defs><ellipse cx="80" cy="142" rx="48" ry="6" fill="#400D0E" opacity="0.16" filter="url(#vk-cast)"/><g class="vk-layer" style="transform:translate(calc(var(--vk-px,0) * 1px),calc(var(--vk-py,0) * 1px))"><g filter="url(#vk-matte)"><path d="M46 30L118 30L118 118L46 118Z" fill="url(#vk-cr-shade)" transform="rotate(-7 82 74)"/><path d="M46 30L118 30L118 118L46 118Z" fill="url(#vk-hl)"/><path d="M46 30L118 30L118 118L46 118Z" fill="url(#vk-bounce)"/></g></g><g class="vk-layer" style="transform:translate(calc(var(--vk-px,0) * 1.7px),calc(var(--vk-py,0) * 1.7px))"><g filter="url(#vk-matte)"><path d="M38 40L104 40L118 54L118 130L38 130Z" fill="url(#vk-cr)"/><path d="M38 40L104 40L118 54L118 130L38 130Z" fill="url(#vk-hl)"/><path d="M38 40L104 40L118 54L118 130L38 130Z" fill="url(#vk-bounce)"/></g></g><g class="vk-layer" style="transform:translate(calc(var(--vk-px,0) * 2px),calc(var(--vk-py,0) * 2px))"><path d="M52 64H96M52 78H104M52 92H84" stroke="#DD5E3F" stroke-opacity=".3" stroke-width="5" stroke-linecap="round" fill="none"/></g><g class="vk-layer" style="transform:translate(calc(var(--vk-px,0) * 3px),calc(var(--vk-py,0) * 3px))"><g filter="url(#vk-matte)"><path d="M90 112a20 20 0 1 0 40 0a20 20 0 1 0 -40 0Z" fill="url(#vk-or)"/><path d="M90 112a20 20 0 1 0 40 0a20 20 0 1 0 -40 0Z" fill="url(#vk-hl)"/><path d="M90 112a20 20 0 1 0 40 0a20 20 0 1 0 -40 0Z" fill="url(#vk-bounce)"/></g><g filter="url(#vk-matte)"><path d="M103 112a7 7 0 1 0 14 0a7 7 0 1 0 -14 0Z" fill="url(#vk-cr)"/><path d="M103 112a7 7 0 1 0 14 0a7 7 0 1 0 -14 0Z" fill="url(#vk-hl)"/><path d="M103 112a7 7 0 1 0 14 0a7 7 0 1 0 -14 0Z" fill="url(#vk-bounce)"/></g></g></svg>
