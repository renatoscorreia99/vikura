<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Evidência"><title>Evidência</title><defs>
  <radialGradient id="vk-or" cx=".32" cy=".26" r=".95">
